<style>

    --input: hsl(240 3.7% 15.9%); --primary: hsl(0 0% 98%); --primary-foreground: hsl(240 5.9% 10%);
    --accent: hsl(240 3.7% 15.9%); --ring: hsl(240 4.9% 83.9%); --bar: hsl(0 0% 98%); --bar-track: hsl(240 3.7% 18%);

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--background); color: var(--foreground); font-family: var(--font); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  button, select, input { font: inherit; color: inherit; }

  .header { border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--background); z-index: 10; }
  .header-inner { max-width: 1400px; margin: 0 auto; padding: 0 16px; height: 56px; display: flex; align-items: center; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; white-space: nowrap; }
  .brand .dot { width: 20px; height: 20px; border-radius: 6px; background: var(--primary); display: inline-block; }
  .tabs { display: flex; gap: 2px; background: var(--muted); padding: 3px; border-radius: var(--radius); margin-left: 8px; }
  .tab { border: 0; background: transparent; padding: 5px 12px; border-radius: 6px; color: var(--muted-foreground); cursor: pointer; font-weight: 500; }
  .tab[aria-selected="true"] { background: var(--card); color: var(--foreground); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
  .spacer { flex: 1; }
  .meta { color: var(--muted-foreground); font-size: 12px; white-space: nowrap; }
  .icon-btn { border: 1px solid var(--border); background: var(--card); border-radius: var(--radius); width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
  .icon-btn:hover { background: var(--accent); }

  .main { max-width: 1400px; margin: 0 auto; padding: 20px 16px 48px; display: grid; gap: 16px; }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
  .sub { color: var(--muted-foreground); margin: 2px 0 0; }

  .grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
  .grid-2 { display: grid; grid-template-columns: 2fr 3fr; gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); }
  .card-h { padding: 16px 20px 0; display: flex; align-items: center; justify-content: space-between; }
  .card-t { font-size: 13px; font-weight: 500; margin: 0; }
  .card-b { padding: 8px 20px 20px; }
  .kpi { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; }
  .kpi-sub { color: var(--muted-foreground); font-size: 12px; margin-top: 4px; }

  .bars { display: grid; gap: 8px; margin-top: 8px; }
  .bar-row { display: grid; grid-template-columns: 170px 1fr 36px; align-items: center; gap: 10px; cursor: pointer; }
  .bar-row:hover .bar-fill { opacity: .8; }
  .bar-label { font-size: 12px; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-track { background: var(--bar-track); height: 10px; border-radius: 0 4px 4px 0; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--bar); border-radius: 0 4px 4px 0; transition: width .3s; }
  .bar-n { font-variant-numeric: tabular-nums; font-size: 12px; text-align: right; }

  .actions { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 10px; }
  .actions li { display: grid; grid-template-columns: 8px 1fr; gap: 10px; align-items: start; }
  .actions .pip { width: 8px; height: 8px; border-radius: 50%; background: var(--now); margin-top: 7px; }
  .actions .who { color: var(--muted-foreground); font-size: 12px; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .field { border: 1px solid var(--input); background: var(--card); border-radius: var(--radius); height: 36px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; }
  .field input, .field select { border: 0; background: transparent; outline: none; height: 100%; min-width: 0; }
  .field.search { flex: 1 1 240px; }
  .field.search input { width: 100%; }
  .field input[type=range] { width: 110px; }
  .field .lbl { color: var(--muted-foreground); font-size: 12px; }
  .count { color: var(--muted-foreground); font-size: 12px; margin-left: auto; }
  .btn { border: 1px solid var(--border); background: var(--card); border-radius: var(--radius); height: 36px; padding: 0 12px; cursor: pointer; font-weight: 500; }
  .btn:hover { background: var(--accent); }

  table { width: 100%; border-collapse: collapse; }
  thead th { text-align: left; font-weight: 500; color: var(--muted-foreground); font-size: 12px; padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--muted); }
  thead th:first-child { border-top-left-radius: var(--radius); }
  thead th:last-child { border-top-right-radius: var(--radius); }
  tbody td { padding: 14px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr.row:hover { background: color-mix(in srgb, var(--accent) 55%, transparent); }
  .th-sort { cursor: pointer; user-select: none; }
  .col-insight { width: 32%; } .col-source { width: 14%; } .col-impl { width: 30%; } .col-action { width: 24%; }
  .headline { font-weight: 500; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .badge { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; font-size: 11px; color: var(--muted-foreground); background: var(--card); white-space: nowrap; }
  .badge.now { color: var(--now); background: var(--now-bg); border-color: transparent; font-weight: 500; }
  .badge.watch { color: var(--watch); background: var(--watch-bg); border-color: transparent; font-weight: 500; }
  .conf { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .conf .track { width: 90px; height: 6px; background: var(--bar-track); border-radius: 3px; overflow: hidden; }
  .conf .fill { height: 100%; background: var(--bar); border-radius: 3px; }
  .conf .v { font-family: var(--mono); font-size: 11px; color: var(--muted-foreground); }
  .src a { font-weight: 500; text-decoration: none; border-bottom: 1px solid var(--border); }
  .src a:hover { border-bottom-color: var(--foreground); }
  .src .kind { display: block; color: var(--muted-foreground); font-size: 12px; margin-top: 2px; font-family: var(--mono); }
  .quote-btn { border: 0; background: none; padding: 0; margin-top: 8px; color: var(--muted-foreground); font-size: 12px; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  .quote { display: none; margin-top: 8px; padding: 10px 12px; border-left: 2px solid var(--border); background: var(--muted); border-radius: 0 6px 6px 0; font-size: 13px; color: var(--muted-foreground); white-space: pre-wrap; }
  .quote.open { display: block; }
  .godo { font-weight: 500; }
  .godo.none { color: var(--muted-foreground); font-weight: 400; }
  .who { color: var(--muted-foreground); font-size: 12px; margin-top: 4px; }
  .empty { padding: 40px; text-align: center; color: var(--muted-foreground); }
  .footer { color: var(--muted-foreground); font-size: 12px; }
  .mobile-label { display: none; }

  @media (max-width: 1000px) {
    .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }

    thead { display: none; }
    tbody tr.row { border-bottom: 1px solid var(--border); padding: 6px 0; }
    tbody td { border-bottom: 0; padding: 8px 14px; }
    .mobile-label { display: block; font-size: 11px; color: var(--muted-foreground); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 3px; }

</head>
<body>
<header class="header">
  <div class="header-inner">
    <div class="brand"><span class="dot" aria-hidden="true"></span>Customer Intelligence</div>
    <div class="tabs" id="customer-tabs" role="tablist" aria-label="Customer"></div>
    <div class="spacer"></div>
    <span class="meta" id="meta"></span>
    <button class="icon-btn" id="theme" title="Toggle theme" aria-label="Toggle theme">

    </button>
  </div>
</header>

<main class="main">
  <div>
    <h1 id="title">Signals</h1>
    <p class="sub">Verified customer signals with source, implication for Prologis, and the action to take. Every quote is verbatim from the linked source.</p>
  </div>

  <section class="grid-4" id="kpis"></section>

  <section class="grid-2">
    <div class="card">
      <div class="card-h"><h2 class="card-t">Signals by type</h2><span class="meta">click to filter</span></div>
      <div class="card-b"><div class="bars" id="bars"></div></div>
    </div>
    <div class="card">
      <div class="card-h"><h2 class="card-t">Actions to take this cycle</h2><span class="meta" id="actions-meta"></span></div>
      <div class="card-b"><ul class="actions" id="actions"></ul></div>
    </div>
  </section>

  <section class="toolbar" id="toolbar">
    <label class="field search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search insights, places, quotes" aria-label="Search"></label>
    <label class="field"><span class="lbl">Type</span><select id="f-type"><option value="">All</option></select></label>
    <label class="field"><span class="lbl">Audience</span><select id="f-aud"><option value="">All</option><option value="c-suite">C-suite</option><option value="account_team">Account team</option><option value="leasing">Leasing</option><option value="all">Everyone</option></select></label>
    <label class="field"><span class="lbl">Horizon</span><select id="f-hor"><option value="">All</option><option value="now">Act now</option><option value="watch">Watch</option></select></label>
    <label class="field"><span class="lbl">Min confidence</span><input id="f-conf" type="range" min="0" max="1" step="0.05" value="0"><span class="v" id="f-conf-v" style="font-family:var(--mono);font-size:12px">0.00</span></label>
    <button class="btn" id="reset">Reset</button>
    <span class="count" id="count"></span>
  </section>

  <section class="card">
    <table id="table">
      <thead><tr>
        <th class="col-insight th-sort" data-sort="confidence">Insight</th>
        <th class="col-source th-sort" data-sort="published_at">Source</th>
        <th class="col-impl">What it means for Prologis</th>
        <th class="col-action">Action</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>

  <p class="footer" id="footer"></p>
</main>

  // theme
  const root = document.documentElement;
  try { const t = localStorage.getItem('ci-theme'); if (t) root.dataset.theme = t; } catch (e) {}
  $('#theme').addEventListener('click', () => {
    const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'light' : 'dark';
    try { localStorage.setItem('ci-theme', root.dataset.theme); } catch (e) {}
  });

  // customer tabs
  const tabs = $('#customer-tabs');
  for (const [slug, name] of Object.entries(DATA.customers)) {
    const b = document.createElement('button');
    b.className = 'tab'; b.role = 'tab'; b.textContent = name; b.dataset.slug = slug;
    b.addEventListener('click', () => { state.customer = slug; render(); });
    tabs.appendChild(b);
  }
  // type filter options
  for (const [code, name] of Object.entries(DATA.types)) {
    const o = document.createElement('option'); o.value = code; o.textContent = name; $('#f-type').appendChild(o);
  }
  $('#meta').textContent = `Generated ${DATA.generated}`;
  $('#footer').textContent = `Confidence = 0.45 × specificity + 0.40 × source reliability + 0.15 × corroboration (each scaled 0–1). Generated ${DATA.generated} by the Prologis customer-intelligence pipeline.`;

  const inputs = { q: '#q', type: '#f-type', aud: '#f-aud', hor: '#f-hor', conf: '#f-conf' };
  for (const [k, sel] of Object.entries(inputs)) {
    const el = $(sel); el.value = state[k];
    el.addEventListener('input', () => { state[k] = k === 'conf' ? parseFloat(el.value) : el.value; render(); });
  }
  $('#reset').addEventListener('click', () => { Object.assign(state, { q: '', type: '', aud: '', hor: '', conf: 0 }); for (const [k, sel] of Object.entries(inputs)) $(sel).value = state[k]; render(); });
  document.querySelectorAll('.th-sort').forEach((th) => th.addEventListener('click', () => {
    const key = th.dataset.sort; if (state.sort === key) state.dir *= -1; else { state.sort = key; state.dir = -1; } render();
  }));

  function filtered() {
    const q = state.q.trim().toLowerCase();
    return DATA.signals.filter((s) => s.customer === state.customer)
      .filter((s) => !state.type || s.signal_code === state.type)
      .filter((s) => !state.aud || s.audience === state.aud)
      .filter((s) => !state.hor || s.horizon === state.hor)
      .filter((s) => (s.confidence || 0) >= state.conf)
      .filter((s) => !q || [s.headline, s.implication, s.go_do, s.geography, s.quote, s.magnitude].join(' ').toLowerCase().includes(q))
      .sort((a, b) => { const x = a[state.sort] ?? '', y = b[state.sort] ?? ''; return (x > y ? 1 : x < y ? -1 : 0) * state.dir; });
  }

  function kpi(label, value, sub) {
    return `<div class="card"><div class="card-h"><h2 class="card-t">${label}</h2></div><div class="card-b"><div class="kpi">${value}</div><div class="kpi-sub">${sub}</div></div></div>`;
  }

  function render() {
    try { localStorage.setItem('ci-state', JSON.stringify(state)); } catch (e) {}
    document.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-selected', t.dataset.slug === state.customer));
    $('#f-conf-v').textContent = state.conf.toFixed(2);
    const all = DATA.signals.filter((s) => s.customer === state.customer);
    const rows = filtered();
    $('#title').textContent = `${DATA.customers[state.customer] || ''} signals`;

    const now = all.filter((s) => s.horizon === 'now').length;
    const avg = all.length ? (all.reduce((a, s) => a + (s.confidence || 0), 0) / all.length) : 0;
    const high = all.filter((s) => (s.confidence || 0) >= 0.8).length;
    const sources = new Set(all.map((s) => s.source_url)).size;
    $('#kpis').innerHTML = kpi('Verified signals', all.length, `${sources} distinct sources`) +
      kpi('Act now', now, 'need a brief or an action this cycle') +
      kpi('Watching', all.length - now, 'trends to monitor over 2+ quarters') +
      kpi('Avg confidence', avg.toFixed(2), `${high} at 0.80 or above`);

    // bars by type (single series, one hue)
    const counts = {};
    for (const s of all) counts[s.signal_code] = (counts[s.signal_code] || 0) + 1;
    const max = Math.max(1, ...Object.values(counts));
    $('#bars').innerHTML = Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([code, n]) =>
      `<div class="bar-row" role="button" tabindex="0" data-code="${esc(code)}" title="${esc(DATA.types[code] || code)}: ${n} signal${n === 1 ? '' : 's'}">
        <span class="bar-label">${esc(DATA.types[code] || code)}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${(n / max * 100).toFixed(1)}%"></div></div>
        <span class="bar-n">${n}</span></div>`).join('') || '<div class="empty">No signals yet</div>';
    document.querySelectorAll('.bar-row').forEach((r) => r.addEventListener('click', () => { state.type = state.type === r.dataset.code ? '' : r.dataset.code; $('#f-type').value = state.type; render(); }));

    // actions list
    const acts = all.filter((s) => s.horizon === 'now' && s.go_do && !/^none/i.test(s.go_do)).sort((a, b) => b.confidence - a.confidence).slice(0, 8);
    $('#actions-meta').textContent = `${acts.length} of ${now}`;
    $('#actions').innerHTML = acts.map((s) => `<li><span class="pip" aria-hidden="true"></span><div><div>${esc(s.go_do)}</div><div class="who">${esc(AUD[s.audience] || s.audience || '')} · confidence ${(s.confidence || 0).toFixed(2)} · <a href="${esc(s.source_url)}" target="_blank" rel="noopener">source</a></div></div></li>`).join('') || '<li class="empty">Nothing flagged for action.</li>';

    // table
    $('#count').textContent = `${rows.length} of ${all.length}`;
    $('#rows').innerHTML = rows.map((s) => {
      const conf = (s.confidence || 0);
      const none = !s.go_do || /^none/i.test(s.go_do);
      return `<tr class="row">
        <td>
          <div class="mobile-label">Insight</div>
          <div class="headline">${esc(s.headline)}</div>
          <div class="badges">
            <span class="badge ${esc(s.horizon)}">${s.horizon === 'now' ? 'Act now' : 'Watch'}</span>
            <span class="badge">${esc(DATA.types[s.signal_code] || s.signal_code)}</span>
            ${s.geography && s.geography !== 'unspecified' ? `<span class="badge">${esc(s.geography)}</span>` : ''}
            ${s.magnitude && s.magnitude !== 'unspecified' ? `<span class="badge">${esc(s.magnitude)}</span>` : ''}
          </div>
          <div class="conf" title="Specificity ${s.specificity}/3 · reliability ${s.source_reliability}/3 · corroboration ${s.corroboration}"><div class="track"><div class="fill" style="width:${(conf * 100).toFixed(0)}%"></div></div><span class="v">${conf.toFixed(2)}</span></div>
          <button class="quote-btn" type="button" aria-expanded="false">Show quote</button>
          <div class="quote">“${esc(s.quote)}”</div>
        </td>
        <td class="src">
          <div class="mobile-label">Source</div>
          <a href="${esc(s.source_url)}" target="_blank" rel="noopener">${esc(SRC[s.source_type] || s.source_type)}</a>
          <span class="kind">${esc(s.published_at || '')}${s.corroboration > 1 ? ` · ${s.corroboration} sources` : ''}</span>
        </td>
        <td><div class="mobile-label">What it means for Prologis</div>${esc(s.implication || '')}</td>
        <td>
          <div class="mobile-label">Action</div>
          <div class="godo ${none ? 'none' : ''}">${esc(none ? 'None; monitor.' : s.go_do)}</div>
          <div class="who">${esc(AUD[s.audience] || s.audience || '')}</div>
        </td>
      </tr>`;
    }).join('') || `<tr><td colspan="4" class="empty">No signals match these filters.</td></tr>`;
    document.querySelectorAll('.quote-btn').forEach((b) => b.addEventListener('click', () => {
      const q = b.nextElementSibling; const open = q.classList.toggle('open');
      b.textContent = open ? 'Hide quote' : 'Show quote'; b.setAttribute('aria-expanded', open);
    }));
  }
  render();
})();
</script>
</body>
</html>
